name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate daily data (site/data/daily.json)
        run: python3 scripts/daily.py validate

      - name: Validate AI news data (site/data/news.json)
        run: python3 scripts/news.py validate

      - name: Build sitemap.xml
        run: python3 scripts/seo.py sitemap

      - name: Deploy site/ to Cloudflare Workers (90yu.kdns.fr)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Notify search engines (IndexNow → Bing etc.)
        continue-on-error: true
        run: python3 scripts/seo.py indexnow
